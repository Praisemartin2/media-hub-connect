name: Fetch Drive videos
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cut extended clip 2 from Episode 167
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p ep167
          gdown "https://drive.google.com/uc?id=1iiKo6PIw46uvcPEJz1hF4DaIoe8Pattv" -O raw167.mp4
          # 3-piece: freedom philosophy -> the proof -> the AI layer
          ffmpeg -v error -i raw167.mp4 -filter_complex "\
            [0:v]trim=4.66:19.64,setpts=PTS-STARTPTS[v0];[0:a]atrim=4.66:19.64,asetpts=PTS-STARTPTS[a0];\
            [0:v]trim=40.56:52.74,setpts=PTS-STARTPTS[v1];[0:a]atrim=40.56:52.74,asetpts=PTS-STARTPTS[a1];\
            [0:v]trim=125.38:137.42,setpts=PTS-STARTPTS[v2];[0:a]atrim=125.38:137.42,asetpts=PTS-STARTPTS[a2];\
            [v0][a0][v1][a1][v2][a2]concat=n=3:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart ep167/cut2x_raw.mp4
          ls -la ep167/
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 ep167/cut2x_raw.mp4
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ep167/
          git commit -m "Add Episode 167 extended clip 2 [skip ci]" || echo "nothing to commit"
          git push
