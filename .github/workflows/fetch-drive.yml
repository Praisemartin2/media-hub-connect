name: Fetch Drive videos
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cut story clips from Episode 167
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p ep167
          gdown "https://drive.google.com/uc?id=1iiKo6PIw46uvcPEJz1hF4DaIoe8Pattv" -O raw167.mp4
          # what is on screen during each story
          for t in 800 820 1420 1440; do
            ffmpeg -v error -ss $t -i raw167.mp4 -frames:v 1 -vf scale=960:-2 ep167/scr_${t}.jpg
          done
          # story A: the uncleaned unit
          ffmpeg -v error -ss 797.10 -to 841.32 -i raw167.mp4 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k \
            -movflags +faststart ep167/storyA_raw.mp4
          # story B: the botched eviction
          ffmpeg -v error -ss 1411.74 -to 1450.48 -i raw167.mp4 \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k \
            -movflags +faststart ep167/storyB_raw.mp4
          ls -la ep167/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ep167/
          git commit -m "Add Episode 167 story cuts + screen frames [skip ci]" || echo "nothing to commit"
          git push
