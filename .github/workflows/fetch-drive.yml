name: Fetch Drive videos
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cut AI-operations story from Episode 167
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p ep167
          gdown "https://drive.google.com/uc?id=1iiKo6PIw46uvcPEJz1hF4DaIoe8Pattv" -O raw167.mp4
          # A: AI auto-reply to guests  |  B: three VAs down to one
          ffmpeg -v error -i raw167.mp4 -filter_complex "\
            [0:v]trim=995.20:1020.68,setpts=PTS-STARTPTS[v0]; \
            [0:a]atrim=995.20:1020.68,asetpts=PTS-STARTPTS[a0]; \
            [0:v]trim=1060.40:1095.94,setpts=PTS-STARTPTS[v1]; \
            [0:a]atrim=1060.40:1095.94,asetpts=PTS-STARTPTS[a1]; \
            [v0][a0][v1][a1]concat=n=2:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k \
            -movflags +faststart ep167/storyC_raw.mp4
          ls -la ep167/
      - name: Download replacement b-roll
        run: |
          set -e
          mkdir -p aiops/broll
          b="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o aiops/broll/c1b_phone_dark.png  "$b/hf_20260813_045847_ca6124cd-fd73-46a0-aab1-d7f5c83fe19e.png"
          curl -fsSL -o aiops/broll/c1c_thumb_glow.png  "$b/hf_20260813_045847_98c30ad3-a8d5-4224-a19b-860d5c9888a7.png"
          curl -fsSL -o aiops/broll/c5b_agents_back.png "$b/hf_20260813_045847_f7e86172-5148-45ad-8a4a-1d9054649e8e.png"
          curl -fsSL -o aiops/broll/c5c_agents_blur.png "$b/hf_20260813_045847_54624839-e0b3-4231-8414-0a97fdb32f11.png"
          ls -la aiops/broll/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ep167/ aiops/
          git commit -m "Add Episode 167 AI-operations cut + replacement b-roll [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
