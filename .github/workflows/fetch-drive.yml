name: Fetch Drive videos
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Episode 167 and transcribe
        run: |
          set -e
          pip install -q gdown faster-whisper
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p ep167
          gdown "https://drive.google.com/uc?id=1iiKo6PIw46uvcPEJz1hF4DaIoe8Pattv" -O raw167.mp4
          ls -la raw167.mp4
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 raw167.mp4
          # audio only for transcription (fast, small)
          ffmpeg -v error -i raw167.mp4 -vn -ac 1 -ar 16000 ep167/audio.wav
          python3 - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          segments, info = m.transcribe("ep167/audio.wav", word_timestamps=True, vad_filter=True)
          words, segs = [], []
          for s in segments:
              segs.append({"start": round(s.start,2), "end": round(s.end,2), "text": s.text.strip()})
              for w in (s.words or []):
                  words.append({"w": w.word.strip(), "start": round(w.start,3), "end": round(w.end,3)})
          json.dump({"segments":segs,"words":words}, open("ep167/transcript.json","w"), indent=1)
          print("segments", len(segs), "duration", segs[-1]["end"] if segs else 0)
          PY
          rm -f ep167/audio.wav
      - name: Commit transcript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ep167/transcript.json
          git commit -m "Add Episode 167 transcript [skip ci]" || echo "nothing to commit"
          git push
