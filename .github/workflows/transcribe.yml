name: Transcribe Drive videos
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/transcribe.yml', '.github/scripts/transcribe.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcribe with Whisper
        run: |
          set -e
          pip install -q faster-whisper
          python3 .github/scripts/transcribe.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drive_src/*_transcript.json
          git commit -m "Add Whisper transcripts [skip ci]" || echo "nothing to commit"
          git push
