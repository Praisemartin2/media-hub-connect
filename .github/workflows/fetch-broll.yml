name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch site imagery and optimize
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick >/dev/null
          mkdir -p pmo/site_images
          B="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          get () { # id slug
            curl -fsSL --retry 5 --retry-all-errors -A "$UA" -o "/tmp/$2.png" "$B/hf_20260910_002451_$1.png"
            convert "/tmp/$2.png" -resize '1920x1920>' -strip -interlace Plane -sampling-factor 4:2:0 -quality 82 "pmo/site_images/$2.jpg"
            convert "/tmp/$2.png" -resize '960x960>' -strip -quality 80 "pmo/site_images/$2_960.jpg"
            printf "%s %s\n" "$2" "$(du -k pmo/site_images/$2.jpg | cut -f1)KB"
          }
          get 01669c29-1bc4-4284-aabc-961acd3384c5 hero_neighborhood
          get b6b66383-e1ef-4628-a1c6-0929234597d1 blueprint_desk
          get 653c93a4-b84e-4ff9-9478-96c4cb892d62 home_dusk
          get 6c33fafa-9adc-43ef-819a-9433915a4e2b studio_camera
          get 1267fff9-37bc-4b13-9719-7554d1ff615a dc_rowhouses
          get cb19f4ee-8f27-4a76-94de-39d2b420753c bokeh_lights
          montage pmo/site_images/*_960.jpg -tile 3x2 -geometry 480x320+6+6 -background black pmo/site_images/_contact_sheet.jpg
          ls -la pmo/site_images
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pmo/site_images/
          git commit -m "Add editorial site imagery for pmo-media.com [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
