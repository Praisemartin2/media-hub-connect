name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source video
        run: |
          set -e
          pip install -q -U yt-dlp
          mkdir -p yt4
          URL="https://youtu.be/e-piFY-JUqg"
          ok=0
          for pc in tv_embedded ios web_safari android_vr web; do
            echo "--- trying player_client=$pc ---"
            if yt-dlp --extractor-args "youtube:player_client=$pc" \
                 -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720][ext=mp4]/b" \
                 --merge-output-format mp4 \
                 -o "yt4/source.%(ext)s" "$URL"; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "ALL_CLIENTS_FAILED"; exit 1; fi
          ls -la yt4/
      - name: Transcribe
        run: |
          pip install -q faster-whisper
          python3 - <<'PY'
          import json, glob
          from faster_whisper import WhisperModel
          src = sorted(glob.glob("yt4/source.*"))[0]
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          segments, info = m.transcribe(src, word_timestamps=True, vad_filter=True)
          words, segs = [], []
          for s in segments:
              segs.append({"start": round(s.start,2), "end": round(s.end,2), "text": s.text.strip()})
              for w in (s.words or []):
                  words.append({"w": w.word.strip(), "start": round(w.start,3), "end": round(w.end,3)})
          json.dump({"segments":segs,"words":words}, open("yt4/transcript.json","w"), indent=1)
          print("duration", segs[-1]["end"] if segs else 0, "words", len(words))
          PY
      - name: Commit transcript only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yt4/transcript.json
          git commit -m "Add yt4 transcript [skip ci]"
          git push
      - name: Upload source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt4-source
          path: yt4/source.*
          retention-days: 3
