name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check video oembed
        run: |
          mkdir -p vidcheck
          for vid in "9ks-DxJ4g4M" "9ks-DxJ4g4m" "9Ks-DxJ4g4M"; do
            echo "=== $vid ===" >> vidcheck/oembed.txt
            curl -s -w "HTTP %{http_code}\n" "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${vid}&format=json" >> vidcheck/oembed.txt || true
            echo "" >> vidcheck/oembed.txt
          done
          cat vidcheck/oembed.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vidcheck/
          git commit -m "Add video oembed check [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
