name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze shot quality windows
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          gdown --folder "https://drive.google.com/drive/folders/1lEeWmRNQehrGVKtcH3xA5xPjxzoAHEUs" -O event
          mkdir -p event_meta2 an
          python3 - <<'PY'
          import json, os, re, subprocess
          CLIPS = ["20260821_165415","20260821_160023","20260821_165535","20260821_164554",
                   "20260821_165613","20260821_164529","20260821_163710","20260821_163827",
                   "20260821_171605","20260821_171450","20260821_165652","20260821_165734",
                   "20260821_172538","20260821_160909","20260821_162417","20260821_160056",
                   "20260821_173206"]
          def stats(path, out, motion):
              vf = "fps=10,scale=480:-2,"
              vf += "tblend=all_mode=difference," if motion else ""
              vf += f"signalstats,metadata=print:key=lavfi.signalstats.YAVG:file={out}"
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",path,"-vf",vf,"-f","null","-"], check=True)
          def parse(out):
              vals = []
              t = None
              for line in open(out):
                  m = re.match(r"frame:\d+\s+pts:\d+\s+pts_time:([\d.]+)", line)
                  if m: t = float(m.group(1)); continue
                  m = re.match(r"lavfi\.signalstats\.YAVG=([\d.]+)", line)
                  if m and t is not None: vals.append((t, float(m.group(1))))
              return vals
          import statistics
          result = {}
          for c in CLIPS:
              p = f"event/{c}.mp4"
              if not os.path.exists(p): print("MISSING", c); continue
              stats(p, f"an/{c}_luma.txt", False)
              stats(p, f"an/{c}_mot.txt", True)
              luma = parse(f"an/{c}_luma.txt")
              mot  = parse(f"an/{c}_mot.txt")
              dur = luma[-1][0] if luma else 0
              wins = {}
              for wl in (2.0, 3.0):
                  cands = []
                  s = 0.0
                  while s + wl <= dur:
                      lv = [v for t,v in luma if s <= t < s+wl]
                      mv = [v for t,v in mot  if s <= t < s+wl]
                      if lv and mv:
                          ymean = statistics.mean(lv); ystd = statistics.pstdev(lv)
                          mmean = statistics.mean(mv); mmax = max(mv)
                          pen = 0.0
                          if ymean < 85: pen += (85-ymean)*0.3
                          if ymean > 190: pen += (ymean-190)*0.3
                          score = mmean + mmax*0.3 + ystd*0.8 + pen
                          cands.append({"start": round(s,2), "score": round(score,2),
                                        "mot": round(mmean,2), "mmax": round(mmax,2),
                                        "yavg": round(ymean,1), "ystd": round(ystd,1)})
                      s += 0.25
                  cands.sort(key=lambda x: x["score"])
                  keep = []
                  for cd in cands:
                      if all(abs(cd["start"]-k["start"]) >= wl*0.7 for k in keep):
                          keep.append(cd)
                      if len(keep) == 3: break
                  wins[str(wl)] = keep
              result[c] = {"dur": round(dur,2), "windows": wins}
              todo = [(w["start"], 2.0, i) for i, w in enumerate(wins["2.0"][:2])]
              todo += [(w["start"], 3.0, 9) for w in wins["3.0"][:1]]
              for s, wl, i in todo:
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-ss",str(s),"-t",str(wl),
                      "-i",p,"-vf",f"fps={6/wl:.4f},scale=200:-2,tile=6x1","-frames:v","1","-q:v","6",
                      f"event_meta2/{c}_w{i}_{s:.2f}.jpg"], check=True)
              print(c, json.dumps(wins)[:200])
          json.dump(result, open("event_meta2/windows.json","w"), indent=1)
          PY
          du -sh event_meta2/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add event_meta2/
          git commit -m "Add shot quality analysis [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
