name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble EP5 The Shrug
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip -q install faster-whisper
          mkdir -p seg exports/series_see_you_at_75/qa
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -fsSL -A "$UA" --retry 5 --retry-all-errors --retry-delay 3 -o toon2d/ep5/s5_v2.mp4 \
            "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260830_043130_1cfa25a7-10cd-4f1b-ba6d-93e3f33f6767.mp4" </dev/null
          ffmpeg -y -loglevel error -i toon2d/ep5/s5_v2.mp4 -vf "fps=1.25,scale=160:284,tile=12x1" -frames:v 1 toon2d/ep5/s5_v2_strip.jpg </dev/null
          ffmpeg -y -loglevel error -i toon2d/ep5/s5_v2.mp4 -vn -ar 16000 -ac 1 /tmp/s5v2.wav </dev/null
          python3 - <<'PYEOF'
          import json
          from faster_whisper import WhisperModel
          out = {}
          for model in ["small.en","medium.en"]:
              m = WhisperModel(model, compute_type="int8")
              segs, _ = m.transcribe("/tmp/s5v2.wav")
              out[model] = " | ".join(s.text.strip() for s in segs)
              print(model, "=>", out[model])
          json.dump(out, open("toon2d/ep5/s5_v2_check.json","w"), indent=1)
          PYEOF
          norm () { # in out
            ffmpeg -y -loglevel error -i "$1" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setsar=1" \
              -af "aformat=sample_rates=44100:channel_layouts=stereo" \
              -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a aac -ar 44100 "$2" </dev/null
          }
          norm toon2d/ep5/s1.mp4 seg/p1.mp4
          norm toon2d/ep5/s2.mp4 seg/p2.mp4
          norm toon2d/ep5/s3.mp4 seg/p3.mp4
          norm toon2d/ep5/s4.mp4 seg/p4.mp4
          norm toon2d/ep5/s5_v2.mp4 seg/p5.mp4
          norm toon2d/ep5/s6.mp4 seg/p6.mp4
          ffmpeg -y -loglevel error -framerate 30 -loop 1 -t 4.5 -i toon2d/ep5/endcard.png \
            -f lavfi -t 4.5 -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
            -vf "scale=1080:1920,fps=30,setsar=1" \
            -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a aac -ar 44100 seg/p7.mp4 </dev/null
          printf "file 'p1.mp4'\nfile 'p2.mp4'\nfile 'p3.mp4'\nfile 'p4.mp4'\nfile 'p5.mp4'\nfile 'p6.mp4'\nfile 'p7.mp4'\n" > seg/list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i seg/list.txt \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:v copy -c:a aac -b:a 160k -movflags +faststart \
            "exports/series_see_you_at_75/Ekabo_SeeYouAt75_EP5_The-Shrug.mp4" </dev/null
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "exports/series_see_you_at_75/Ekabo_SeeYouAt75_EP5_The-Shrug.mp4" </dev/null
          ffmpeg -y -loglevel error -i "exports/series_see_you_at_75/Ekabo_SeeYouAt75_EP5_The-Shrug.mp4" \
            -vf "fps=0.5,scale=160:284,tile=7x4" -frames:v 1 exports/series_see_you_at_75/qa/EP5_grid.jpg </dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon2d/ep5/ exports/series_see_you_at_75/
          git commit -m "Add EP5 The Shrug assembled episode [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
