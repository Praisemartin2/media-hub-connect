name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 2D cast lineup variants
        run: |
          set -e
          mkdir -p toon2d
          b="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o toon2d/lineup2d_v1.png "$b/hf_20260818_043542_0ffed6d1-c931-432c-b5a6-446ee683f852.png"
          curl -fsSL -o toon2d/lineup2d_v2.png "$b/hf_20260818_043542_9622a812-59e7-4bd4-8f7f-07e135c1693d.png"
          ls -la toon2d/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon2d/
          git commit -m "Add 2D cast lineup variants [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
