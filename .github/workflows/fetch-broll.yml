name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render 60s party cut
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          gdown --folder "https://drive.google.com/drive/folders/1lEeWmRNQehrGVKtcH3xA5xPjxzoAHEUs" -O event
          mkdir -p seg exports/woodbury_park
          MUSIC=""
          for t in "Life of Riley" "Carefree" "Funk Game Loop"; do
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote('$t'))")
            if curl -fsSL -o seg/music.mp3 "https://incompetech.com/music/royalty-free/mp3-royaltyfree/${enc}.mp3"; then
              MUSIC="$t"; break
            fi
          done
          echo "MUSIC TRACK: $MUSIC"; test -n "$MUSIC"
          echo "$MUSIC" > exports/woodbury_park/music_track_60s.txt
          python3 - <<'PY'
          import re, struct, subprocess
          def run(cmd): subprocess.run(cmd, check=True)
          def probe_transfer(path):
              p = subprocess.run(["ffprobe","-v","error","-select_streams","v:0",
                  "-show_entries","stream=color_transfer","-of","default=nk=1:nw=1",path],
                  capture_output=True, text=True)
              return p.stdout.strip()
          def measure_yavg(path):
              out = "seg/_m.txt"
              run(["ffmpeg","-y","-loglevel","error","-i",path,
                   "-vf","fps=6,scale=240:-2,signalstats,metadata=print:key=lavfi.signalstats.YAVG:file="+out,
                   "-f","null","-"])
              vals=[float(m.group(1)) for line in open(out)
                    for m in [re.match(r"lavfi\.signalstats\.YAVG=([\d.]+)", line)] if m]
              return sum(vals)/len(vals) if vals else 0
          NORM  = "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,fps=30,setsar=1"
          GRADE = "curves=all='0/0.02 0.5/0.55 1/0.985',eq=saturation=1.08:gamma=1.03:contrast=1.03"
          TONE  = ("zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,"
                   "tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p")
          EDL = [
            ("01","20260821_162417.mp4", 0.75, 3.0, False),
            ("02","20260821_162857.mp4", 3.00, 1.8, False),
            ("03","20260821_163827.mp4", 1.25, 1.8, False),
            ("04","20260821_163710.mp4", 0.00, 3.0, False),
            ("05","20260821_163744.mp4", 4.50, 1.8, False),
            ("06","20260821_171605.mp4", 2.75, 1.8, False),
            ("07","20260821_171613.mp4", 4.25, 1.8, False),
            ("08","20260821_165613.mp4",16.00, 1.8, False),
            ("09","20260821_164554.mp4",64.50, 2.4, True),
            ("10","20260821_165608.mp4", 0.25, 1.8, False),
            ("11","20260821_162541.mp4",45.25, 1.8, False),
            ("12","20260821_165535.mp4",17.25, 1.8, False),
            ("13","20260821_164529.mp4", 0.00, 3.0, False),
            ("14","20260821_171450.mp4", 8.50, 3.0, False),
            ("15","20260821_160944.mp4", 1.00, 1.8, False),
            ("16","20260821_165652.mp4", 2.50, 3.0, True),
            ("17","20260821_165705.mp4", 5.50, 3.0, False),
            ("18","20260821_165734.mp4", 0.50, 1.8, False),
            ("19","20260821_163907.mp4", 1.75, 1.8, False),
            ("20","20260821_160909.mp4",18.00, 3.0, True),
            ("21","20260821_172538.mp4", 3.50, 3.0, False),
          ]
          for idx, src, tin, dur, slomo in EDL:
              path = f"event/{src}"
              srcdur = dur*0.8 if slomo else dur
              tr = probe_transfer(path)
              tone = TONE + "," if tr in ("smpte2084","arib-std-b67") else ""
              trf = f"seg/s{idx}.trf"
              run(["ffmpeg","-y","-loglevel","error","-ss",str(tin),"-t",str(round(srcdur+0.1,2)),"-i",path,
                   "-vf",f"vidstabdetect=result={trf}:shakiness=6","-f","null","-"])
              stab = f"vidstabtransform=input={trf}:smoothing=30:optzoom=1:interpol=bicubic,unsharp=5:5:0.4,"
              slow = "setpts=PTS/0.8,minterpolate=fps=30:mi_mode=blend," if slomo else ""
              vf = f"{stab}{tone}{NORM},{slow}{GRADE}"
              base = f"seg/b{idx}.mp4"
              run(["ffmpeg","-y","-loglevel","error","-ss",str(tin),"-t",str(round(srcdur+0.1,2)),"-i",path,
                   "-vf",vf,"-t",str(dur),"-an","-c:v","libx264","-preset","medium","-crf","18",
                   "-pix_fmt","yuv420p",base])
              y = measure_yavg(base)
              fin = f"seg/s{idx}.mp4"
              if abs(y-137) > 7:
                  off = max(-0.10, min(0.10, (137.0-y)/255.0))
                  run(["ffmpeg","-y","-loglevel","error","-i",base,"-vf",f"eq=brightness={off:.3f}",
                       "-an","-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p",fin])
                  print(idx,"yavg",round(y,1),"corrected",round(off,3))
              else:
                  run(["ffmpeg","-y","-loglevel","error","-i",base,"-c","copy",fin])
                  print(idx,"yavg",round(y,1),"ok")
          # main montage: hard cuts, concat demuxer
          with open("seg/list.txt","w") as f:
              for idx,_,_,_,_ in EDL: f.write(f"file 's{idx}.mp4'\n")
          run(["ffmpeg","-y","-loglevel","error","-f","concat","-safe","0","-i","seg/list.txt",
               "-c","copy","seg/main.mp4"])
          # photo cards with gentle zoom + end card
          for src, out, secs in [("overlays_doc/staff_card1.png","seg/p1.mp4",3.5),
                                 ("overlays_doc/staff_card2.png","seg/p2.mp4",3.5)]:
              frames = int(secs*30)
              run(["ffmpeg","-y","-loglevel","error","-framerate","30","-loop","1","-t",str(secs),"-i",src,
                   "-vf",f"scale=2160:3840,zoompan=z='1+0.00045*on':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920:fps=30,setsar=1",
                   "-an","-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p",out])
          run(["ffmpeg","-y","-loglevel","error","-loop","1","-t","5.0","-i","overlays_doc/endcard.png",
               "-vf","scale=1080:1920,fps=30,setsar=1","-an",
               "-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p","seg/end.mp4"])
          # music: find first strong downbeat for beat-aligned start
          run(["ffmpeg","-y","-loglevel","error","-i","seg/music.mp3","-ac","1","-ar","8000","-f","s16le","seg/pcm.raw"])
          data = open("seg/pcm.raw","rb").read()
          n = len(data)//2
          smp = struct.unpack(f"<{n}h", data)
          win = 400  # 50ms
          rms = [ (sum(x*x for x in smp[i:i+win])/win)**0.5 for i in range(0, min(n, 8000*6)-win, win) ]
          mx = max(rms); rms = [r/mx for r in rms]
          onset = 0.0
          for i in range(1, len(rms)):
              if rms[i] - rms[i-1] > 0.25 and rms[i] > 0.5:
                  onset = i*0.05; break
          print("music onset", onset)
          # assemble: main + photos + end with xfade, montage total:
          def vdur(path):
              q = subprocess.run(["ffprobe","-v","error","-show_entries","format=duration",
                                  "-of","default=nk=1:nw=1",path],capture_output=True,text=True)
              return float(q.stdout.strip())
          main_d = vdur("seg/main.mp4")
          p1_d = vdur("seg/p1.mp4"); p2_d = vdur("seg/p2.mp4")
          print("durations", main_d, p1_d, p2_d)
          o1 = main_d - 0.5
          o2 = o1 + p1_d - 0.5
          o3 = o2 + p2_d - 0.5
          total = o3 + 5.0
          fc = (f"[0:v][1:v]xfade=transition=fade:duration=0.5:offset={o1:.2f}[xa];"
                f"[xa][2:v]xfade=transition=fade:duration=0.5:offset={o2:.2f}[xb];"
                f"[xb][3:v]xfade=transition=fade:duration=0.5:offset={o3:.2f}[vc];"
                f"[4:v]format=rgba[mt];[vc][mt]overlay=0:0:shortest=1[vm];"
                f"[5:v]format=rgba,fade=in:st=0.5:d=0.5:alpha=1,fade=out:st=2.6:d=0.5:alpha=1[c1];[vm][c1]overlay[v1];"
                f"[6:v]format=rgba,fade=in:st=6.8:d=0.5:alpha=1,fade=out:st=9.1:d=0.5:alpha=1[c2];[v1][c2]overlay[v2];"
                f"[7:v]format=rgba,fade=in:st=11.6:d=0.5:alpha=1,fade=out:st=14.4:d=0.5:alpha=1[c3];[v2][c3]overlay[v3];"
                f"[8:v]format=rgba,fade=in:st=15.2:d=0.5:alpha=1,fade=out:st=18.5:d=0.5:alpha=1[c4];[v3][c4]overlay[v4];"
                f"[9:v]format=rgba,fade=in:st=42.2:d=0.5:alpha=1,fade=out:st=47.0:d=0.5:alpha=1[c5];[v4][c5]overlay[v];"
                f"[10:a]atrim={onset}:{onset+total:.2f},asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.4,"
                f"afade=t=out:st={total-2.5:.2f}:d=2.5,loudnorm=I=-16:TP=-1.5:LRA=11[a]")
          out = "exports/woodbury_park/Woodbury_BackToSchoolBash_60s.mp4"
          import os
          for crf in ("20","23"):
              run(["ffmpeg","-y","-loglevel","error",
                   "-i","seg/main.mp4","-i","seg/p1.mp4","-i","seg/p2.mp4","-i","seg/end.mp4",
                   "-loop","1","-i","overlays_doc/matte.png",
                   "-loop","1","-i","overlays_doc/card1.png",
                   "-loop","1","-i","overlays_doc/card2.png",
                   "-loop","1","-i","overlays_doc/card3.png",
                   "-loop","1","-i","overlays_doc/card_fun.png",
                   "-loop","1","-i","overlays_doc/card4.png",
                   "-i","seg/music.mp3",
                   "-filter_complex",fc,"-map","[v]","-map","[a]","-t",f"{total:.2f}",
                   "-c:v","libx264","-preset","medium","-crf",crf,"-pix_fmt","yuv420p",
                   "-c:a","aac","-b:a","192k","-movflags","+faststart",out])
              sz = os.path.getsize(out)/1e6
              print("crf",crf,"size MB",round(sz,1))
              if sz < 95: break
          print("total", total)
          PY
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 exports/woodbury_park/Woodbury_BackToSchoolBash_60s.mp4
          mkdir -p exports/woodbury_park/qa
          ffmpeg -y -loglevel error -i exports/woodbury_park/Woodbury_BackToSchoolBash_60s.mp4 \
            -vf "select='eq(n\,30)+eq(n\,210)+eq(n\,390)+eq(n\,510)+eq(n\,690)+eq(n\,870)+eq(n\,1020)+eq(n\,1170)+eq(n\,1290)+eq(n\,1440)+eq(n\,1530)+eq(n\,1680)',scale=270:480,tile=4x3" \
            -frames:v 1 exports/woodbury_park/qa/grid_60s.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/woodbury_park/
          git commit -m "Add 60s party cut [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
