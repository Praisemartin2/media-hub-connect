name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download documentary fonts
        run: |
          set -e
          mkdir -p fontsdoc
          b="https://github.com/google/fonts/raw/main"
          curl -fsSL -o fontsdoc/PlayfairDisplay-Regular.ttf "$b/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          curl -fsSL -o fontsdoc/CormorantGaramond-Light.ttf "$b/ofl/cormorantgaramond/CormorantGaramond-Light.ttf" || true
          curl -fsSL -o fontsdoc/Montserrat-Light.ttf "$b/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          ls -la fontsdoc/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fontsdoc/
          git commit -m "Add documentary fonts [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
