name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch PMO display and body fonts
        run: |
          set -e
          mkdir -p pmo/brand/fonts
          fetch_font () { # family file
            css=$(curl -fsSL -A "Mozilla/5.0" "https://fonts.googleapis.com/css2?family=$1&display=swap")
            url=$(echo "$css" | grep -oE 'https://fonts.gstatic.com/[^)]+\.(ttf|woff2)' | head -1)
            curl -fsSL -o "pmo/brand/fonts/$2" "$url"
            ls -la "pmo/brand/fonts/$2"
          }
          fetch_font "Anton" Anton-Regular.ttf
          fetch_font "Oswald:wght@600" Oswald-SemiBold.ttf
          fetch_font "Inter:wght@400" Inter-Regular.ttf
          fetch_font "Inter:ital,wght@1,400" Inter-Italic.ttf
          fetch_font "Inter:wght@700" Inter-Bold.ttf
          file pmo/brand/fonts/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pmo/
          git commit -m "Add PMO brand fonts [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
