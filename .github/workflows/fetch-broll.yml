name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          mkdir -p v4broll
          curl -fsSL -o v4broll/b1_family.png  "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260717_002112_aee5c7d3-ca24-47ab-b365-87f81decb9dc.png"
          curl -fsSL -o v4broll/b2_paycheck.png "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260717_002113_2ae104d2-0da0-4f07-9682-aaa8735cc353.png"
          curl -fsSL -o v4broll/b3_clock.png   "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260717_002113_1a9ef804-ec0c-4db4-b02e-63de73df6c23.png"
          curl -fsSL -o v4broll/b4_dial.png    "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260717_002125_fa90d3f4-d267-4909-9981-c24cd6f48cf4.png"
          curl -fsSL -o v4broll/b5_rentals.png "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260717_002126_a659c1b3-49a3-46f4-a731-8a01114e2e14.png"
          ls -la v4broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/ clips/ canva/ v1broll/ v2broll/ v3broll/ v4broll/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
