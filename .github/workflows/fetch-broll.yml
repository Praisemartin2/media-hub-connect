name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch IG style reference screenshots
        run: |
          set -e
          mkdir -p pmo/style_ref
          B=https://d2ol7oe51mr4n9.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev
          curl -fsSL -o pmo/style_ref/ig_top.png "$B/d594f2f1-5381-4492-a154-24c476143213.png"
          curl -fsSL -o pmo/style_ref/ig_grid.png "$B/4e7c4258-1ccb-4b1f-ab9d-c6ba864155f1.png"
          ls -la pmo/style_ref/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pmo/
          git commit -m "Add IG style reference captures [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
