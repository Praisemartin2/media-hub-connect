name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fonts
        run: |
          set -e
          mkdir -p fonts
          g="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -fsSL -o "fonts/PlayfairDisplay.ttf"       "$g/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          curl -fsSL -o "fonts/PlayfairDisplay-Italic.ttf" "$g/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          curl -fsSL -o "fonts/Caveat.ttf"                "$g/caveat/Caveat%5Bwght%5D.ttf"
          ls -la fonts/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fonts/
          git commit -m "Add carousel fonts [skip ci]"
          git push
