name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-transcribe EP3 shot 2 with medium model
        run: |
          set -e
          pip install -q faster-whisper
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          python3 - <<'PY'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("medium.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe("toon2d/ep3/s2.mp4", word_timestamps=True, vad_filter=True)
          S = []
          for x in segs:
              words = [{"w": w.word, "s": round(w.start,2), "e": round(w.end,2)} for w in (x.words or [])]
              S.append({"start": round(x.start,2), "end": round(x.end,2), "text": x.text.strip(), "words": words})
          json.dump({"segments": S}, open("toon2d/ep3/s2_tr_med.json","w"))
          print("s2 med |", " / ".join(x["text"] for x in S))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon2d/
          git commit -m "Add EP3 s2 medium transcript [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
