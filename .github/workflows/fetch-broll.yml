name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o broll/flag_a.png "$base/hf_20260709_000649_a0543f79-c5ea-4d88-9aa2-cfdca4a6ed6c.png"
          curl -fsSL -o broll/flag_b.png "$base/hf_20260709_000651_5bd52ee5-d73a-4ba2-a94a-58b426271eb0.png"
          ls -la broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
