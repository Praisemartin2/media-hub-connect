name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render back-to-school documentary reel
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          gdown --folder "https://drive.google.com/drive/folders/1lEeWmRNQehrGVKtcH3xA5xPjxzoAHEUs" -O event
          mkdir -p seg exports/woodbury_park
          # CC-BY music (Kevin MacLeod / incompetech), first that downloads wins
          MUSIC=""
          for t in "Wholesome" "Carefree" "Sincerely"; do
            if curl -fsSL -o seg/music.mp3 "https://incompetech.com/music/royalty-free/mp3-royaltyfree/${t}.mp3"; then
              MUSIC="$t"; break
            fi
          done
          echo "MUSIC TRACK: $MUSIC"; test -n "$MUSIC"
          echo "$MUSIC" > exports/woodbury_park/music_track.txt
          python3 - <<'PY'
          import re, subprocess
          def run(cmd): subprocess.run(cmd, check=True)
          def probe_transfer(path):
              p = subprocess.run(["ffprobe","-v","error","-select_streams","v:0",
                  "-show_entries","stream=color_transfer","-of","default=nk=1:nw=1",path],
                  capture_output=True, text=True)
              return p.stdout.strip()
          def measure_yavg(path):
              out = "seg/_m.txt"
              run(["ffmpeg","-y","-loglevel","error","-i",path,
                   "-vf","fps=6,scale=240:-2,signalstats,metadata=print:key=lavfi.signalstats.YAVG:file="+out,
                   "-f","null","-"])
              vals=[float(m.group(1)) for line in open(out)
                    for m in [re.match(r"lavfi\.signalstats\.YAVG=([\d.]+)", line)] if m]
              return sum(vals)/len(vals) if vals else 0
          NORM  = "scale=1080:1920:force_original_aspect_ratio=increase:flags=lanczos,crop=1080:1920,fps=30,setsar=1"
          GRADE = "curves=all='0/0.02 0.5/0.55 1/0.985',eq=saturation=1.04:gamma=1.03:contrast=1.03"
          TONE  = ("zscale=t=linear:npl=100,format=gbrpf32le,zscale=p=bt709,"
                   "tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv,format=yuv420p")
          # (idx, src, in, visible_dur, slomo)
          EDL = [
            ("01","20260821_162417.mp4", 0.75, 3.5, False),
            ("02","20260821_163827.mp4", 0.00, 3.0, False),
            ("03","20260821_163710.mp4", 0.00, 3.5, False),
            ("04","20260821_171605.mp4", 2.75, 2.1, False),
            ("05","20260821_165535.mp4",17.00, 3.5, False),
            ("06","20260821_164554.mp4",64.50, 3.0, True),
            ("07","20260821_164529.mp4", 0.00, 3.5, False),
            ("08","20260821_171450.mp4", 8.50, 3.5, False),
            ("09","20260821_165652.mp4", 2.50, 3.0, True),
            ("10","20260821_172538.mp4", 3.50, 4.0, False),
          ]
          for idx, src, tin, dur, slomo in EDL:
              path = f"event/{src}"
              srcdur = dur*0.8 if slomo else dur
              tr = probe_transfer(path)
              tone = TONE + "," if tr in ("smpte2084","arib-std-b67") else ""
              trf = f"seg/s{idx}.trf"
              run(["ffmpeg","-y","-loglevel","error","-ss",str(tin),"-t",str(round(srcdur+0.1,2)),"-i",path,
                   "-vf",f"vidstabdetect=result={trf}:shakiness=6","-f","null","-"])
              stab = f"vidstabtransform=input={trf}:smoothing=30:optzoom=1:interpol=bicubic,unsharp=5:5:0.4,"
              slow = "setpts=PTS/0.8,minterpolate=fps=30:mi_mode=blend," if slomo else ""
              vf = f"{stab}{tone}{NORM},{slow}{GRADE}"
              base = f"seg/b{idx}.mp4"
              run(["ffmpeg","-y","-loglevel","error","-ss",str(tin),"-t",str(round(srcdur+0.1,2)),"-i",path,
                   "-vf",vf,"-t",str(dur),"-an","-c:v","libx264","-preset","medium","-crf","18",
                   "-pix_fmt","yuv420p",base])
              y = measure_yavg(base)
              fin = f"seg/s{idx}.mp4"
              if abs(y-137) > 7:
                  off = max(-0.10, min(0.10, (137.0-y)/255.0))
                  run(["ffmpeg","-y","-loglevel","error","-i",base,"-vf",f"eq=brightness={off:.3f}",
                       "-an","-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p",fin])
                  print(idx,"yavg",round(y,1),"corrected",round(off,3))
              else:
                  run(["ffmpeg","-y","-loglevel","error","-i",base,"-c","copy",fin])
                  print(idx,"yavg",round(y,1),"ok")
          # end card 5.0s
          run(["ffmpeg","-y","-loglevel","error","-loop","1","-t","5.0","-i","overlays_doc/endcard.png",
               "-vf","scale=1080:1920,fps=30,setsar=1","-an",
               "-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p","seg/s11.mp4"])
          # assembly: xfade chain + matte + timed cards + music
          starts = [0.0]
          for _,_,_,d,_ in EDL: starts.append(starts[-1] + d - 0.5)
          # starts[1..10] are xfade offsets for segs 2..10 and end card
          ins = sum([["-i",f"seg/s{i:02d}.mp4"] for i in range(1,12)], [])
          ins += ["-loop","1","-i","overlays_doc/matte.png"]
          for c in ["card1","card2","card3","card4"]:
              ins += ["-loop","1","-i",f"overlays_doc/{c}.png"]
          ins += ["-i","seg/music.mp3"]
          fc = []
          prev = "[0:v]"
          for i in range(1,11):
              out = f"[x{i}]"
              fc.append(f"{prev}[{i}:v]xfade=transition=fade:duration=0.5:offset={starts[i]:.2f}{out}")
              prev = out
          total = starts[10] + 5.0
          fc.append(f"{prev}[11:v]overlay=0:0:shortest=1[vm]")
          cards = [ ("12", 1.0, 3.4), ("13", 6.0, 8.6), ("14", 8.8, 10.4), ("15", 22.2, 27.0) ]
          # order: matte(11) is input index 11; cards 12-15; music 16
          cur = "[vm]"
          for k,(ci, tin, tout) in enumerate(cards):
              fc.append(f"[{ci}:v]format=rgba,fade=in:st={tin}:d=0.5:alpha=1,fade=out:st={tout}:d=0.5:alpha=1[c{k}]")
              nxt = f"[vc{k}]"
              fc.append(f"{cur}[c{k}]overlay=0:0:shortest=1{nxt}")
              cur = nxt
          fc.append(f"{cur}null[v]")
          fc.append(f"[16:a]atrim=0:{total:.2f},afade=t=in:st=0:d=0.6,afade=t=out:st={total-2.2:.2f}:d=2.2,loudnorm=I=-16:TP=-1.5:LRA=11[a]")
          run(["ffmpeg","-y","-loglevel","error"] + ins +
              ["-filter_complex",";".join(fc),"-map","[v]","-map","[a]",
               "-t",f"{total:.2f}","-c:v","libx264","-preset","medium","-crf","18",
               "-pix_fmt","yuv420p","-c:a","aac","-b:a","192k","-movflags","+faststart",
               "exports/woodbury_park/Woodbury_ReadyForTheFirstDay_LinkedIn.mp4"])
          print("total", total)
          PY
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 exports/woodbury_park/Woodbury_ReadyForTheFirstDay_LinkedIn.mp4
          mkdir -p exports/woodbury_park/qa
          ffmpeg -y -loglevel error -i exports/woodbury_park/Woodbury_ReadyForTheFirstDay_LinkedIn.mp4 \
            -vf "select='eq(n\,45)+eq(n\,150)+eq(n\,210)+eq(n\,285)+eq(n\,390)+eq(n\,510)+eq(n\,630)+eq(n\,760)+eq(n\,900)',scale=270:480,tile=3x3" \
            -frames:v 1 exports/woodbury_park/qa/grid_li.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/woodbury_park/
          git commit -m "Add back-to-school documentary reel [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
