name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reel music
        run: |
          set -e
          mkdir -p pmo/assets/music
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0"
          curl -fsSL -A "$UA" -o pmo/assets/music/Cipher.mp3 "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Cipher.mp3" || true
          curl -fsSL -A "$UA" -o pmo/assets/music/Basement_Floor.mp3 "https://incompetech.com/music/royalty-free/mp3-royaltyfree/Basement%20Floor.mp3" || true
          ls -la pmo/assets/music/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pmo/
          git commit -m "Add PMO reel music [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
