name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Victory Sunday clips + contact sheets
        run: |
          set -e
          pip install -q gdown
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p vs vs_meta
          fetch () { gdown -q "$1" -O "vs/$2" || echo "FAILED $2"; }
          fetch 1ZsTkXry12fUpiwKVk5qt8lYKbz9MaxNh plymouth.mov
          fetch 1WnNXj9zFNc47NLqxJAwzj-kZh3qOg4lP levelridge.mov
          fetch 1Gwv2mXiw0MW3JQu749j-kHUMLbh-bPaX niyi_close.mov
          fetch 1dCh2maql7GIKAK6EpYPqVA-8ncUcbxQk hammond.mov
          fetch 1kIaHOjjCYV4ARQ8Y2jbKdzBRySqyLl0D jordan.mov
          fetch 1Xzz9_7ln4FOaaoZZy27WjmeOzmwkoqMU princess.mov
          fetch 1AeDPJBkkdCYjvVEx91wwndtGuWW1SN_L baby.mov
          fetch 1Rk-ZudDxRWUATukDFh-7fUJJEP8wgt8C edited_close.mp4
          fetch 1Eitu6Qv9oI0gD5bcVFCzNLO1e_mt0DvP doctors.mov
          fetch 1ULX1uLnSe60dtg226vVBop5q8BycaimF vs_22226.mov
          fetch 1RHyWNFacBCWI2XtvVrHCxysn0Vcj87ti niyi_close_228.mov
          fetch 1BvdZL-SfkNkKe1eriNlZBbDauSZ__ddR killed_deal.mov
          fetch 1NpWUMFsp8mXl_7QMi_1ggidkHB-p0bCt retired60.mov
          fetch 1fiEB497LrZKkBhlWWxBrd9SB4_XKyDPo relationship.mp4
          ls -la vs/
          python3 - <<'PY'
          import glob, json, os, subprocess
          meta = {}
          for v in sorted(glob.glob("vs/*")):
              name = os.path.splitext(os.path.basename(v))[0]
              p = subprocess.run(["ffprobe","-v","error","-select_streams","v:0",
                  "-show_entries","stream=width,height:format=duration","-of","json", v],
                  capture_output=True, text=True)
              try:
                  d = json.loads(p.stdout)
                  dur = float(d["format"]["duration"])
                  st = d["streams"][0]
              except Exception as e:
                  print("SKIP", name, e); continue
              meta[name] = {"dur": round(dur,2), "w": st["width"], "h": st["height"]}
              n = 10
              step = dur / n
              vf = (f"fps=1/{step:.4f},scale=220:-2,"
                    f"drawtext=text='%{{pts\\:hms}}':fontsize=20:fontcolor=yellow:borderw=2:x=6:y=6,"
                    f"tile=5x2")
              subprocess.run(["ffmpeg","-y","-loglevel","error","-i",v,
                  "-vf", vf, "-frames:v","1","-q:v","6",
                  f"vs_meta/{name}.jpg"], check=True)
              print(name, meta[name])
          json.dump(meta, open("vs_meta/durations.json","w"), indent=1)
          PY
          du -sh vs_meta/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vs_meta/
          git commit -m "Add Victory Sunday contact sheets [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
