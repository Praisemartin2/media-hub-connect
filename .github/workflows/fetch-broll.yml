name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try yt-dlp on EP169
        run: |
          pip install -q -U yt-dlp
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p vidcheck ep169
          ok=0
          for client in android ios tv web_embedded; do
            echo "=== client $client ===" >> vidcheck/ytdlp.txt
            if yt-dlp --extractor-args "youtube:player_client=$client" -f "bv*[height<=720]+ba/b[height<=720]"                  --merge-output-format mp4 -o "ep169/full.mp4" --no-playlist                  "https://www.youtube.com/watch?v=9ks-DxJ4g4M" >> vidcheck/ytdlp.txt 2>&1; then
              ok=1; echo "SUCCESS with $client" >> vidcheck/ytdlp.txt; break
            fi
          done
          if [ "$ok" = "1" ]; then
            python3 - <<'PY2'
          import subprocess, json
          d = subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nk=1:nw=1","ep169/full.mp4"],capture_output=True,text=True).stdout.strip()
          open("vidcheck/ep169_dur.txt","w").write(d)
          print("duration", d)
          PY2
            # audio for transcription + low-res proxy for review
            ffmpeg -y -loglevel error -i ep169/full.mp4 -ac 1 -ar 16000 -b:a 48k vidcheck/ep169_audio.mp3
            pip install -q faster-whisper
            python3 - <<'PY3'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe("vidcheck/ep169_audio.mp3", word_timestamps=False, vad_filter=True)
          S = [{"start": round(x.start,1), "end": round(x.end,1), "text": x.text.strip()} for x in segs]
          json.dump({"segments": S}, open("vidcheck/ep169_transcript.json","w"))
          print("segments:", len(S))
          PY3
          fi
          tail -5 vidcheck/ytdlp.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vidcheck/
          git commit -m "EP169 yt-dlp test + transcript [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
