name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          mkdir -p v2broll
          curl -fsSL -o v2broll/b1_quit.png    "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260715_002217_9ba7a75c-a45b-4218-a233-446c5bc49201.png"
          curl -fsSL -o v2broll/b2_buffett.png "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260715_002219_2958175c-e2a8-489d-aea9-c3bb6a5a1a93.png"
          curl -fsSL -o v2broll/b3_chart.png   "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260715_002221_800c034c-5094-460d-8df8-71c17383207a.png"
          curl -fsSL -o v2broll/b4_trophy.png  "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260715_002234_efc0ce11-15e2-4788-89b2-4fade6613d4e.png"
          curl -fsSL -o v2broll/b5_hourglass.png "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260715_002236_5665acba-1711-400a-bb5e-ce88eaf77abf.png"
          ls -la v2broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/ clips/ canva/ v1broll/ v2broll/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
