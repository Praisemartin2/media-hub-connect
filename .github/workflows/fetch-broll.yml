name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          mkdir -p canva
          curl -fsSL -o canva/t1.jpg "https://design.canva.ai/NYWzOG25O65n9pj"
          curl -fsSL -o canva/t2.jpg "https://design.canva.ai/V8jUNPIk5Pzf7Mj"
          curl -fsSL -o canva/t3.jpg "https://design.canva.ai/b578ugnUGFjolWd"
          curl -fsSL -o canva/t4.jpg "https://design.canva.ai/HOAA4df4ryyMQ5A"
          ls -la canva/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/ clips/ canva/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
