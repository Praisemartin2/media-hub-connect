name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EP169 audio from Buzzsprout RSS + transcribe
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip install -q faster-whisper
          mkdir -p ep169
          curl -fsSL -o ep169/feed.rss "https://feeds.buzzsprout.com/1909068.rss"
          python3 - <<'PY2'
          import re, json, subprocess
          rss = open("ep169/feed.rss", encoding="utf-8", errors="replace").read()
          items = rss.split("<item>")[1:]
          found = None
          for it in items:
              tm = re.search(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", it, re.S)
              title = tm.group(1).strip() if tm else ""
              if title.startswith("169") or "Best Time To Sell" in title:
                  em = re.search(r'enclosure url="([^"]+)"', it)
                  found = {"title": title, "mp3": em.group(1) if em else None}
                  break
          json.dump(found or {"error":"not found"}, open("ep169/meta.json","w"), indent=1)
          print(found)
          assert found and found["mp3"], "episode 169 not found in RSS"
          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          urls = [found["mp3"], found["mp3"] + "?download=true"]
          ok = False
          for u in urls:
              r = subprocess.run(["curl","-fSL","-A",ua,"-e","https://financialfreedommastermindpodcast.buzzsprout.com/","-o","ep169/full.mp3",u])
              if r.returncode == 0:
                  ok = True; break
          assert ok, "mp3 download failed"
          subprocess.run(["ffmpeg","-y","-loglevel","error","-i","ep169/full.mp3","-ac","1","-ar","16000","ep169/mono.wav"], check=True)
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe("ep169/mono.wav", word_timestamps=False, vad_filter=True)
          S = [{"s": round(x.start,1), "e": round(x.end,1), "t": x.text.strip()} for x in segs]
          json.dump({"segments": S}, open("ep169/transcript.json","w"))
          print("duration", info.duration, "segments", len(S))
          PY2
          mkdir -p vidcheck
          cp ep169/meta.json ep169/transcript.json vidcheck/ 2>/dev/null || true
          du -sh ep169/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vidcheck/meta.json vidcheck/transcript.json
          git commit -m "Add EP169 meta + transcript [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
