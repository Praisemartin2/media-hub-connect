name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download cast lineup variants
        run: |
          set -e
          mkdir -p toon
          b="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o toon/lineup_v1.png "$b/hf_20260818_024913_f7fea01b-9312-47ea-9f33-8cfe60594ddb.png"
          curl -fsSL -o toon/lineup_v2.png "$b/hf_20260818_024914_9169806b-0e6f-4840-aa65-7c3ee1b5637b.png"
          ls -la toon/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon/
          git commit -m "Add cast lineup variants [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
