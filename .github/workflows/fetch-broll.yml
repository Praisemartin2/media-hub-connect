name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          mkdir -p v1broll
          curl -fsSL -o v1broll/b1_flip.png    "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260714_012009_2daf0538-9e96-4a33-ab40-5e9ce1842ce0.png"
          curl -fsSL -o v1broll/b2_rates.png   "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260714_012011_923c541e-6192-4251-add6-eb94dd65d5e4.png"
          curl -fsSL -o v1broll/b3_luxury.png  "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260714_012012_d23b0719-234d-4a9e-96ca-33b6255de4e0.png"
          curl -fsSL -o v1broll/b4_wire.png    "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260714_012019_b3241dea-d6b1-4884-ae6c-7a7274281eef.png"
          curl -fsSL -o v1broll/b5_empty.png   "https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev/hf_20260714_012021_665477be-8d54-4f2c-a178-b689e66996ec.png"
          ls -la v1broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/ clips/ canva/ v1broll/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
