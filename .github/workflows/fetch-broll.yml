name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o broll/triplex_new.png  "$base/hf_20260711_013403_ed81a7e9-ce2f-4f29-aff7-265cd167b49c.png"
          curl -fsSL -o broll/cash_keys.png    "$base/hf_20260711_013404_51b0df55-9fb3-4bcc-9511-35531daac952.png"
          curl -fsSL -o broll/loan_doc.png     "$base/hf_20260711_013404_d89d3c35-959b-412b-919d-2e1f2816ece6.png"
          ls -la broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/ clips/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
