name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EP169 podcast segments
        run: |
          set -e
          mkdir -p ep169_v3
          B=https://d2ol7oe51mr4n9.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev
          curl -fsSL -o ep169_v3/segA.mp4 "$B/732ac9b3-81f3-4039-a10c-c52621210e1b.mp4"
          curl -fsSL -o ep169_v3/segB.mp4 "$B/885125c9-f037-4e57-980b-1dd1d6e18645.mp4"
          curl -fsSL -o ep169_v3/stripA.jpg "$B/aa2779c2-40da-49eb-9e75-7da973ab2f9c.jpg"
          curl -fsSL -o ep169_v3/stripB.jpg "$B/8c1ba583-ed67-4261-b20a-3457c8146ab8.jpg"
          ls -la ep169_v3/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ep169_v3/
          git commit -m "Add EP169 1080p podcast segments and framing strips [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
