name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download financial-freedom candidate clips
        run: |
          set -e
          mkdir -p ff
          b="https://d8j0ntlcm91z4.cloudfront.net/clipify/user_38Q7UV4HRCn3Op8W57z72pn2Iev/NWZZEa9BURw/1b218c55-4074-43fc-84ec-c72a71a688ee/clips"
          curl -fsSL -o ff/h_kip.mp4        "$b/clip_04.mp4"
          curl -fsSL -o ff/h_vanderbilt.mp4 "$b/clip_06.mp4"
          curl -fsSL -o ff/h_cash.mp4       "$b/clip_07.mp4"
          ls -la ff/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ff/
          git commit -m "Add financial-freedom candidate clips [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
