name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 90s display fonts
        run: |
          set -e
          mkdir -p fonts90s
          b="https://github.com/google/fonts/raw/main"
          curl -fsSL -o fonts90s/LuckiestGuy-Regular.ttf "$b/apache/luckiestguy/LuckiestGuy-Regular.ttf" || \
            curl -fsSL -o fonts90s/LuckiestGuy-Regular.ttf "$b/ofl/luckiestguy/LuckiestGuy-Regular.ttf"
          curl -fsSL -o fonts90s/Chewy-Regular.ttf "$b/apache/chewy/Chewy-Regular.ttf" || \
            curl -fsSL -o fonts90s/Chewy-Regular.ttf "$b/ofl/chewy/Chewy-Regular.ttf"
          curl -fsSL -o fonts90s/Pacifico-Regular.ttf "$b/ofl/pacifico/Pacifico-Regular.ttf"
          ls -la fonts90s/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fonts90s/
          git commit -m "Add 90s display fonts [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
