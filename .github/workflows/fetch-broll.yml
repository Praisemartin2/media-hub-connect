name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          set -e
          mkdir -p broll
          base="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o broll/cine_dusk.png  "$base/hf_20260709_000031_82c21060-c55e-4b71-97c4-eab3ba2a827d.png"
          curl -fsSL -o broll/cine_storm.png "$base/hf_20260709_000054_f258e121-5980-4413-91fe-6206e2b1e8a4.png"
          ls -la broll/
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add broll/
          git commit -m "Add generated b-roll assets [skip ci]"
          git push
