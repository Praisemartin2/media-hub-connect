name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download AI-ops clips
        run: |
          set -e
          mkdir -p aiops
          b="https://d8j0ntlcm91z4.cloudfront.net/clipify/user_38Q7UV4HRCn3Op8W57z72pn2Iev/6oE28Ff8ZU-e20b9599b6/8f7e2766-ad2a-4899-bbae-94da86d2d9e0/clips"
          curl -fsSL -o aiops/a1_ai_reply.mp4 "$b/clip_06.mp4"
          curl -fsSL -o aiops/a2_vas.mp4      "$b/clip_07.mp4"
          ls -la aiops/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aiops/
          git commit -m "Add AI-ops clips [skip ci]" || echo nothing
          git push
