name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medium.en check on EP5 s5 and s6
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          pip -q install faster-whisper
          mkdir -p toon2d/ep5
          ffmpeg -y -loglevel error -i toon2d/ep5/s5.mp4 -vn -ar 16000 -ac 1 /tmp/s5.wav </dev/null
          ffmpeg -y -loglevel error -i toon2d/ep5/s6.mp4 -vn -ar 16000 -ac 1 /tmp/s6.wav </dev/null
          python3 - <<'PYEOF'
          import json
          from faster_whisper import WhisperModel
          m = WhisperModel("medium.en", compute_type="int8")
          out = {}
          for k in ["s5","s6"]:
              segs, _ = m.transcribe(f"/tmp/{k}.wav", word_timestamps=True)
              out[k] = [{"s": round(s.start,2), "e": round(s.end,2), "t": s.text.strip()} for s in segs]
              print(k, "=>", " | ".join(x["t"] for x in out[k]))
          json.dump(out, open("toon2d/ep5/medium_check.json","w"), indent=1)
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon2d/ep5/
          git commit -m "Add EP5 medium.en dialogue check [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
