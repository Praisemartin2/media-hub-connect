name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render EP169 podcast reels
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p seg exports/ep169_reels
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -fSL -A "$UA" -e "https://financialfreedommastermindpodcast.buzzsprout.com/" \
            -o seg/full.mp3 "https://www.buzzsprout.com/1909068/episodes/19699488-169-the-best-time-to-sell-is-when-you-do-not-have-to.mp3"
          render () { # name start dur
            local n=$1 st=$2 dur=$3
            ffmpeg -y -loglevel error -framerate 30 -loop 1 -t 3 -i ep169_assets/${n}_open.png \
              -f lavfi -t 3 -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
              -vf "scale=1080:1920,fps=30,setsar=1,fade=in:st=0:d=0.3:color=white" \
              -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a aac -ar 44100 seg/${n}_o.mp4
            ffmpeg -y -loglevel error -framerate 30 -loop 1 -t $dur -i ep169_assets/${n}_main.png \
              -ss $st -t $dur -i seg/full.mp3 \
              -filter_complex "[1:a]aformat=sample_rates=44100:channel_layouts=stereo,asplit[a1][a2];\
                [a2]showwaves=s=900x160:mode=cline:rate=30:colors=0x004AAD[wv];\
                [0:v]scale=1080:1920,fps=30,setsar=1[bg];\
                [bg][wv]overlay=90:1280[v0];\
                [v0]subtitles=ep169_assets/${n}_caps.ass:fontsdir=fontsdoc[v]" \
              -map "[v]" -map "[a1]" -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p \
              -c:a aac -ar 44100 seg/${n}_m.mp4
            ffmpeg -y -loglevel error -framerate 30 -loop 1 -t 4.5 -i ep169_assets/${n}_end.png \
              -f lavfi -t 4.5 -i "anullsrc=channel_layout=stereo:sample_rate=44100" \
              -vf "scale=1080:1920,fps=30,setsar=1" \
              -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -c:a aac -ar 44100 seg/${n}_e.mp4
            printf "file '${n}_o.mp4'\nfile '${n}_m.mp4'\nfile '${n}_e.mp4'\n" > seg/${n}_list.txt
            ffmpeg -y -loglevel error -f concat -safe 0 -i seg/${n}_list.txt \
              -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:v copy -c:a aac -b:a 160k -movflags +faststart \
              exports/ep169_reels/${n}.mp4
            ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 exports/ep169_reels/${n}.mp4
          }
          render a 240.9 35.1
          render b 5.6 33.6
          mv exports/ep169_reels/a.mp4 "exports/ep169_reels/Ekabo_EP169_Cost-Of-Selling-Too-Soon.mp4"
          mv exports/ep169_reels/b.mp4 "exports/ep169_reels/Ekabo_EP169_3-Most-Expensive-Decisions.mp4"
          mkdir -p exports/ep169_reels/qa
          for f in exports/ep169_reels/*.mp4; do
            base=$(basename "$f" .mp4)
            ffmpeg -y -loglevel error -i "$f" -vf "fps=0.25,scale=180:320,tile=6x2" -frames:v 1 "exports/ep169_reels/qa/${base}.jpg"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ep169_reels/
          git commit -m "Add EP169 podcast reels [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
