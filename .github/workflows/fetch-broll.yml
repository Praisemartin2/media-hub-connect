name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download + transcribe reanimated episode 2 shots
        run: |
          set -e
          pip install -q faster-whisper
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          mkdir -p toon2d/ep2b
          b="https://d8j0ntlcm91z4.cloudfront.net/user_38Q7UV4HRCn3Op8W57z72pn2Iev"
          curl -fsSL -o toon2d/ep2b/s1_boss.mp4   "$b/hf_20260818_225204_ed3b4d65-f2cd-4314-8a9b-9ebc621e075f.mp4"
          curl -fsSL -o toon2d/ep2b/s2_derek.mp4  "$b/hf_20260818_225204_d467894c-26c1-407f-88d6-1370dd1d085a.mp4"
          curl -fsSL -o toon2d/ep2b/s3_marcus.mp4 "$b/hf_20260818_225204_deb8bf78-5dde-4134-8b9c-d0cd7c3c4dbf.mp4"
          curl -fsSL -o toon2d/ep2b/s4_gene.mp4   "$b/hf_20260818_225204_c8da5e4a-f055-4b56-8030-e239b49185f9.mp4"
          curl -fsSL -o toon2d/ep2b/s5_duplex.mp4 "$b/hf_20260818_225204_4869a10a-4c28-4ae9-b784-8da4da484ce9.mp4"
          ls -la toon2d/ep2b/
          python3 - <<'PY'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("toon2d/ep2b/s*.mp4")):
              name = os.path.basename(f)[:-4]
              segs, info = m.transcribe(f, word_timestamps=False, vad_filter=True)
              S = [{"start": round(s.start,2), "end": round(s.end,2), "text": s.text.strip()} for s in segs]
              json.dump({"segments": S}, open(f"toon2d/ep2b/{name}_tr.json","w"))
              print(name, "|", " / ".join(x["text"] for x in S))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon2d/
          git commit -m "Add reanimated episode 2 shots + transcripts [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
