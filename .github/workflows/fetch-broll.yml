name: Fetch b-roll assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-broll.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transcribe episode 1 shots
        run: |
          set -e
          pip install -q faster-whisper
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          python3 - <<'PY'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("toon/s*.mp4")):
              name = os.path.basename(f)[:-4]
              segs, info = m.transcribe(f, word_timestamps=False, vad_filter=True)
              S = [{"start": round(s.start,2), "end": round(s.end,2), "text": s.text.strip()} for s in segs]
              json.dump({"segments": S}, open(f"toon/{name}_tr.json","w"))
              print(name, "|", " / ".join(x["text"] for x in S))
          PY
          ls -la toon/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add toon/
          git commit -m "Add episode 1 dialogue transcripts [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
