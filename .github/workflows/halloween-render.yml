name: Halloween render
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/halloween-render.yml', 'halloween/edl.json', 'halloween/render_v.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sources and tools
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q gdown numpy pillow librosa
          mkdir -p halloween/src
          cut -f1,2 halloween/manifest.tsv | tr '\t' ' ' | xargs -P 4 -n 2 sh -c 'gdown -q -O "halloween/src/$0" "https://drive.google.com/uc?id=$1" || echo "FAILED $0"'
          ls halloween/src | wc -l
      - name: Fog (vertical) and render
        run: |
          set -e
          cd halloween
          python3 tools/fog.py 270 480 24 12 | ffmpeg -y -loglevel error -f rawvideo -pix_fmt gray -s 270x480 -r 24 -i - \
            -vf "scale=1080:1920:flags=bicubic,gblur=sigma=6,format=yuv420p" -c:v libx264 -crf 18 -preset medium assets/fog/fog_v.mp4
          python3 render_v.py edl.json "$(python3 -c "import json;print(json.load(open('edl.json')).get('out','Halloween_Managers_Meeting_v1'))")"
          ls -la out
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add halloween/out/
          git commit -m "Render Halloween highlight [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
