name: Fetch YouTube source
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/fetch-yt.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source video + subs
        run: |
          set -e
          pip install -q yt-dlp
          mkdir -p ytsrc
          # https://youtu.be/XsNlUjbXcL8 replaced at execution time
          yt-dlp -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --write-auto-subs --sub-langs en --convert-subs srt \
            -o "ytsrc/source.%(ext)s" "https://youtu.be/XsNlUjbXcL8"
          ls -la ytsrc/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ytsrc/
          git commit -m "Add YouTube source video [skip ci]" || echo "nothing to commit"
          git push
