name: Halloween mask test
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/halloween-masktest.yml', 'halloween/tools/privacy_mask.py']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache the mask model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: halloween-u2net-isnet-v1
      - name: Mask the TV in the clown / trio shots
        run: |
          set -e
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q gdown pillow numpy scipy "rembg[cpu]"
          cd halloween && mkdir -p src work/clean out/masktest
          rm -f out/masktest/*
          gdown -q -O src/20261028_115955.jpg "https://drive.google.com/uc?id=1R4v4ZaZAjhEPJJjDsUtdcBe4dEISeESi"
          gdown -q -O src/20261028_115920.mp4 "https://drive.google.com/uc?id=1rB4bvUcIbGUvv8SjzL_OsfAhhLZ5MqI_"
          time python3 tools/privacy_mask.py src/20261028_115955.jpg work/clean/20261028_115955.jpg 0.36,0.22,1.0,0.53 --keep 0.435,0.33,0.51,0.40
          time python3 tools/privacy_mask.py src/20261028_115920.mp4 work/clean/20261028_115920.mp4 0.55,0.04,1.0,0.64 0.6 3.4
          for t in 0.1 0.4 0.7 1.0 1.3 1.6 1.9 2.2 2.5 2.8 3.1 3.3; do
            ffmpeg -y -loglevel error -ss $t -i work/clean/20261028_115920.mp4 -frames:v 1 work/a_$t.png
          done
          python3 - <<'PY'
          from PIL import Image
          # masked output only (the unmasked screen must never be committed): full-res crops of the hat / halo region
          b = Image.open('work/clean/20261028_115955.jpg'); W, H = b.size
          c = b.crop((int(0.30*W), int(0.20*H), int(0.85*W), int(0.62*H))); c.thumbnail((1600, 1600)); c.save('out/masktest/115955_masked_crop.jpg', quality=88)
          tiles = []
          for t in ['0.1', '0.4', '0.7', '1.0', '1.3', '1.6', '1.9', '2.2', '2.5', '2.8', '3.1', '3.3']:
              f = Image.open(f'work/a_{t}.png').convert('RGB'); W, H = f.size
              tiles.append(f.crop((int(0.30*W), 0, W, int(0.62*H))))
          tw, th = tiles[0].size; s = Image.new('RGB', (tw*4, th*3), 'black')
          for k, t in enumerate(tiles): s.paste(t, ((k % 4)*tw, (k // 4)*th))
          s.save('out/masktest/115920_masked_frames.jpg', quality=85)
          PY
          ls -la out/masktest work/clean
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add halloween/out/masktest/
          git commit -m "Halloween privacy mask test frames [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
