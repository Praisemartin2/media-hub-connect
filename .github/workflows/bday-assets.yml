name: Birthday assets
on:
  push:
    branches: [claude/ekabo-video-editing-styles-wrs455]
    paths: ['.github/workflows/bday-assets.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fonts and music
        run: |
          set -e
          mkdir -p bday/assets/fonts bday/assets/music
          cd bday/assets/fonts
          G="https://raw.githubusercontent.com/google/fonts/main"
          curl -fsSL -o Cinzel.ttf "$G/ofl/cinzel/Cinzel%5Bwght%5D.ttf"
          curl -fsSL -o CormorantGaramond-Regular.ttf "$G/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf" || true
          curl -fsSL -o GreatVibes-Regular.ttf "$G/ofl/greatvibes/GreatVibes-Regular.ttf"
          curl -fsSL -o AlexBrush-Regular.ttf "$G/ofl/alexbrush/AlexBrush-Regular.ttf"
          curl -fsSL -o Montserrat.ttf "$G/ofl/montserrat/Montserrat%5Bwght%5D.ttf"
          curl -fsSL -o Lato-Regular.ttf "$G/ofl/lato/Lato-Regular.ttf"
          curl -fsSL -o Lato-Bold.ttf "$G/ofl/lato/Lato-Bold.ttf"
          ls -la
          cd ../music
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128 Safari/537.36"
          I="https://incompetech.com/music/royalty-free/mp3-royaltyfree"
          curl -fsSL -A "$UA" -o Canon_in_D_Major.mp3 "$I/Canon%20in%20D%20Major.mp3"
          curl -fsSL -A "$UA" -o Almost_Bliss.mp3 "$I/Almost%20Bliss.mp3"
          curl -fsSL -A "$UA" -o Prelude_in_C.mp3 "$I/Prelude%20in%20C%20(BWV%20846).mp3" || true
          curl -fsSL -A "$UA" -o Touching_Moments_Two.mp3 "$I/Touching%20Moments%20Two%20-%20Higher.mp3" || true
          ls -la
          sudo apt-get -qq install -y ffmpeg >/dev/null
          for f in *.mp3; do ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" | sed "s/^/$f /"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bday/assets/
          git commit -m "Add birthday video fonts and music beds [skip ci]" || echo nothing
          for i in 1 2 3 4 5; do
            git pull --rebase origin claude/ekabo-video-editing-styles-wrs455 && git push && exit 0
            sleep $((i*3))
          done
          exit 1
